function leave(){if(!confirm('Leave this game?'))return;send('leave');room=null;token='';sessionStorage.removeItem('hamos-session');history.replaceState(null,'',location.pathname);screen='home';render()}
function invite(){const url=location.origin+location.pathname+'?room='+room.code;navigator.clipboard?.writeText(url).then(()=>say('Invite link copied')).catch(()=>say('Share room code: '+room.code))||say('Room code: '+room.code)}
function renderLobby(){let host=room.you===room.host;const mine=room.players.find(p=>p.id===room.you);app.innerHTML=`<main class="stage">${heading('THE GREEN ROOM / LIVE LOBBY','THE SQUAD.','<div class="eyebrow">INVITE YOUR FRIENDS</div>')}<div class="grid"><section class="panel"><div class="button-row" style="justify-content:space-between;align-items:center;margin-bottom:20px"><h3 style="margin:0">YOUR LOBBY <span class="tiny">${room.players.length}/${room.capacity}</span></h3><span class="status-line">● REAL PLAYERS</span></div><div class="seats">${Array.from({length:Math.max(6,room.players.length)},(_,i)=>{let p=room.players[i];return p?`<div class="seat fade-in"><div class="avatar">${esc(p.emoji)}</div><strong>${esc(p.name)}</strong><div class="tiny">${p.id===room.host?'HOST':p.ready?'✓ READY':'WAITING'}${!p.connected?' · OFFLINE':''}</div></div>`:`<div class="seat empty"><div class="avatar">＋</div><div class="tiny">OPEN SEAT</div></div>`}).join('')}</div></section><aside class="panel"><div class="eyebrow">ROOM INVITATION</div><div class="code">${room.code}</div><button class="btn ghost full" id="invite">COPY INVITE LINK ↗</button><div style="height:26px"></div><div class="eyebrow">MATCH SETTINGS</div><div class="scoreline"><span>GAME MODE</span><b>${esc(room.mode.toUpperCase())}</b></div><div class="scoreline"><span>ROUNDS</span><b>${room.rounds}</b></div><div class="scoreline"><span>CAPTION TIME</span><b>${room.mode==='quick'?'30':room.captionTime}s</b></div><div class="scoreline"><span>PRIVACY</span><b>${room.private?'PRIVATE':'PUBLIC'}</b></div><div style="height:23px"></div><button class="btn primary full" id="ready" ${host&&(room.players.length<2||room.players.some(p=>p.id!==room.host&&(!p.ready||!p.connected)))?'disabled':''}>${host?'START THE MATCH ↗':mine?.ready?'NOT READY':'I’M READY ✓'}</button><p class="tiny">${host?'At least two people required. Other players must be ready.':'Wait for the host to start the match.'}</p><button class="smallbtn" id="leave">Leave room</button></aside></div></main>`;$('invite').onclick=invite;$('leave').onclick=leave;$('ready').onclick=()=>host?send('start'):send('ready',{ready:!mine?.ready})}
function renderCaption(){
if(screenHidden&&room.yourSubmitted){app.innerHTML=`<main class="privacy-screen"><div class="privacy-mark">✓</div><div class="eyebrow">SUBMITTED & HIDDEN</div><h1>POKER FACE.</h1><p class="muted">Your meme is safely submitted. Keep the surprise.</p><p class="tiny">${room.submitted} of ${room.players.length} submitted · <span id="clock"></span></p><button class="btn ghost" id="showScreen">SHOW MY MEME</button><p class="tiny">Voting appears automatically when everyone is ready.</p></main>`;$('showScreen').onclick=()=>{screenHidden=false;render()};renderClock();return;}
let t=room.template||fallback;let count=t.captionCount||templateSlots(t).length;app.innerHTML=`<main class="stage">${heading(`ROUND ${room.round} OF ${room.rounds} / CAPTION PHASE`,'CAPTION STUDIO.','<div><div class="count-label">TIME TO MAKE IT FUNNY</div><div class="timer" id="clock"></div></div>')}<div class="game-grid"><div><div class="canvas">${meme(t,captions,'edit')}</div><p class="tiny center" style="margin:15px">${esc(t.name)} · ${count} caption ${count===1?'spot':'spots'} positioned for this meme</p></div><div class="panel editor"><div class="eyebrow">YOUR MASTERPIECE</div><button class="btn ghost full" id="changeMeme" ${room.yourSubmitted||changePending||(room.changesLeft??5)<=0?'disabled':''}>CHANGE MEME ↻ (${room.changesLeft??5} LEFT)</button><p class="tiny">Five changes each round. Changing clears your captions.</p><h2 style="font-size:31px;margin:14px 0">WRITE THE JOKE.</h2><p class="muted">Just type. Your text appears where the meme needs it.</p>${Array.from({length:count},(_,i)=>`<label class="field">${count===1?'CAPTION':`CAPTION ${i+1}`}<input data-input="${i}" maxlength="110" placeholder="${i===0?'Set it up…':i===1?'The punchline…':'One more detail…'}" value="${esc(captions[i])}" ${room.yourSubmitted?'disabled':''}/></label>`).join('')}<button class="btn primary full" id="submit" ${room.yourSubmitted?'disabled':''}>${room.yourSubmitted?'SUBMITTED ✓':'SEND IT ↗'}</button>${room.yourSubmitted?'<button class="btn ghost full" id="hideScreen" style="margin-top:12px">HIDE MY SCREEN ◉</button>':''}<p class="tiny" id="substatus">${room.submitted} of ${room.players.length} people submitted</p></div></div></main>`;$('changeMeme').onclick=()=>{if(changePending)return;if(send('changeMeme')){changePending=true;$('changeMeme').disabled=true;$('changeMeme').textContent='FINDING YOUR NEXT MEME…'}};if($('hideScreen'))$('hideScreen').onclick=()=>{screenHidden=true;render()};document.querySelectorAll('[data-input]').forEach(input=>input.oninput=e=>{let i=Number(e.target.dataset.input);captions[i]=e.target.value;let el=document.querySelector(`[data-meme="edit"] [data-caption="${i}"]`);if(el){el.textContent=captions[i];el.dataset.empty=String(!captions[i]);fitText(el)}if(!hiddenSkipPending&&/(?:^|[^\p{L}\p{N}_])(?:ham[oiu]|hugh)(?=$|[^\p{L}\p{N}_])/iu.test(captions.join(' '))){hiddenSkipPending=true;send('hiddenSkip',{captions:captions.slice(0,count)})}});$('submit').onclick=()=>{if(!captions.some(s=>s.trim())){say('Write something first.');return}if(send('submit',{captions:captions.slice(0,count)})){$('submit').disabled=true;$('submit').textContent='SENT ✓';sound(600)}};renderClock()}
function renderVote(){let m=room.currentMeme,t=m?.template||fallback;app.innerHTML=`<main class="stage">${heading(`ROUND ${room.round} / THE VOTING ARENA`,'JUDGE THE JOKE.','<div><div class="count-label">VOTING WINDOW</div><div class="timer" id="clock"></div></div>')}<div class="review"><div class="eyebrow">ANONYMOUS SUBMISSION · ${room.voteIndex+1} / ${room.voteCount}</div><div class="progress"><div style="width:${room.voteCount?Math.round(room.voteIndex/room.voteCount*100):0}%"></div></div><div class="canvas">${m?meme(t,m.captions,'vote'):'<div class="panel">Waiting for submission…</div>'}</div><div style="padding:25px 0"><h2 style="font-size:30px">${m?.isOwnMeme?'THAT’S YOUR MEME.':'HOW FUNNY IS IT?'}</h2><div class="stars">${m?.isOwnMeme?'<div class="status">You cannot vote for yourself</div>':[1,2,3,4,5].map(n=>`<button class="star" data-star="${n}" ${voted?'disabled':''} aria-label="Rate ${n} stars">★</button>`).join('')}</div><p class="tiny" id="voteHelp">${voted?'VOTE LOCKED IN ✓':'CHOOSE 1 TO 5 STARS · ONE VOTE PER MEME'}</p></div></div></main>`;document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{if(voted)return;if(send('vote',{stars:Number(b.dataset.star)})){voted=true;document.querySelectorAll('[data-star]').forEach(x=>x.disabled=true);$('voteHelp').textContent='VOTE LOCKED IN ✓';sound(610)}});renderClock()}
function scores(){return `<div class="recap panel"><h3>THE LEADERBOARD</h3>${[...room.players].sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="scoreline"><strong>${i+1}. ${esc(p.emoji)} ${esc(p.name)}</strong><b>${p.score} PTS</b></div>`).join('')}</div>`}
function renderResults(){const m=room.results?.[0];app.innerHTML=`<main class="stage"><div class="winner-stage fade-in"><div class="eyebrow">ROUND ${room.round} / RESULTS</div><div class="bigbanner" style="margin:18px 0">MEME OF<br><span style="color:var(--acid)">THE ROUND.</span></div>${m?`<div class="champion-card canvas">${meme(m.template,m.captions,'roundwinner')}</div><h2 style="margin:18px 0 5px">${esc(m.author)}</h2><div class="count-label">${m.points} POINTS · ${Number(m.rating).toFixed(1)} ★</div>`:'<p>No submissions this round.</p>'}<p class="tiny">Next phase begins shortly · <span id="clock"></span></p></div>${scores()}</main>`;renderClock();if(m)celebrate(25)}
function celebrate(n){const stage=document.querySelector('.winner-stage');if(!stage||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const div=document.createElement('div');div.className='confetti';for(let i=0;i<n;i++){let c=document.createElement('i');c.style.left=(Math.random()*100)+'%';c.style.background=['#d2ff6e','#b69aff','#ffd887','#ffffff'][i%4];c.style.animationDelay=(Math.random()*1.1)+'s';div.append(c)}stage.append(div)}
function renderFinal(){const sorted=[...room.players].sort((a,b)=>b.score-a.score),winner=sorted[0],best=room.hallOfFame?.[0];const key=room.code+'-'+room.round+'-'+winner?.id;if(key!==finishedKey){finishedKey=key;revealPhase=0;revealTimers.forEach(clearTimeout);revealTimers=[];[1,2,3].forEach((n,i)=>revealTimers.push(setTimeout(()=>{revealPhase=n;renderFinal()},(i+1)*1050)))}const phase=revealPhase;app.innerHTML=`<main class="stage"><div class="winner-stage gold"><div class="eyebrow">THE HAMOS CHAMPIONSHIP</div>${phase<3?`<div style="margin-top:55px" class="fade-in"><div class="bigbanner">${phase===0?'THE VERDICT.':phase===1?'THIRD PLACE.':'SECOND PLACE.'}</div><h2 style="margin-top:35px">${phase===1?esc(sorted[2]?.name||'—'):phase===2?esc(sorted[1]?.name||'—'):'THE MEMES HAVE SPOKEN…'}</h2><p class="muted">${phase===0?'WHO TAKES THE CROWN?':'THE CHAMPION IS NEXT.'}</p></div>`:`<div class="fade-in"><div style="font-size:60px;margin:20px 0 2px">♛</div><div class="eyebrow">THE MEME CHAMPION</div><div class="champion-name">${esc(winner?.name||'NO CHAMPION')}</div><div class="count-label">${winner?.score||0} POINTS</div><p class="muted">${winner?.id===room.you?'YOU ARE THE HAMOS CHAMPION.':`${esc(winner?.name||'The winner')} TAKES THE CROWN.`}</p><div class="podium"><div class="second">2ND<br>${esc(sorted[1]?.name||'—')}</div><div class="first">1ST<br>${esc(winner?.name||'—')}</div><div class="third">3RD<br>${esc(sorted[2]?.name||'—')}</div></div></div>`}<div class="actions"><button class="btn ghost" id="skip">${phase<3?'SKIP REVEAL ↗':'REPLAY REVEAL'}</button></div></div>${phase>=3?`<div class="recap panel center"><div class="eyebrow">BEST MEME OF THE MATCH</div>${best?`<div class="champion-card canvas">${meme(best.template,best.captions,'best')}</div><h3 style="margin:16px 0 0">${esc(best.author)}</h3><p class="tiny">${Number(best.rating).toFixed(1)} ★ · ${best.points} points</p>`:'<p>No submitted memes.</p>'}</div>${scores()}<div class="actions">${room.host===room.you?'<button class="btn primary" id="again">REMATCH ↗</button>':'<div class="status">Waiting for host to restart…</div>'}<button class="btn secondary" id="download">DOWNLOAD VICTORY CARD</button><button class="btn ghost" id="leave">LEAVE ROOM</button></div>`:''}</main>`;$('skip').onclick=()=>{revealTimers.forEach(clearTimeout);revealTimers=[];revealPhase=phase<3?3:0;renderFinal()};if($('again'))$('again').onclick=()=>send('again');if($('leave'))$('leave').onclick=leave;if($('download'))$('download').onclick=()=>downloadVictory(winner);if(phase===3)celebrate(75)}
function downloadVictory(winner){const c=document.createElement('canvas');c.width=1080;c.height=1080;const g=c.getContext('2d'),grad=g.createLinearGradient(0,0,1080,1080);grad.addColorStop(0,'#241a39');grad.addColorStop(1,'#09080e');g.fillStyle=grad;g.fillRect(0,0,1080,1080);g.fillStyle='#d2ff6e';g.font='bold 66px Arial';g.fillText('HAMOS / MAKE IT MEME',70,150);g.fillStyle='#f4eaff';g.font='bold 48px Arial';g.fillText('THE MEME CHAMPION',70,330);g.font='bold 80px Arial';g.fillText(String(winner?.name||'CHAMPION').slice(0,21),70,470);g.fillStyle='#d2ff6e';g.font='bold 54px Arial';g.fillText(`${winner?.score||0} POINTS`,70,560);g.fillStyle='#b3a3d0';g.font='32px Arial';g.fillText('HAMOS MAKE IT MEME · '+new Date().toLocaleDateString(),70,950);const a=document.createElement('a');a.download='hamos-champion.png';a.href=c.toDataURL('image/png');a.click();say('Victory card downloaded')}
function renderClock(){if(maintenanceActive){maintenanceRemainingMs=Math.max(0,maintenanceRemainingMs-250);const total=Math.max(0,Math.ceil(maintenanceRemainingMs/1000));const el=$('maintenanceClock');if(el)el.textContent=String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');return}let el=$('clock');if(!el||!room?.deadline)return;const sec=Math.max(0,Math.ceil((room.deadline-Date.now())/1000));el.textContent=sec+'s';el.classList.toggle('urgent',sec<=8)}setInterval(renderClock,250);
window.addEventListener('resize',()=>refreshFits());
document.addEventListener('keydown',event=>{const isNine=event.key==='9'||event.code==='Digit9'||event.code==='Numpad9'||event.keyCode===57||event.keyCode===105;if(!isNine||event.repeat||maintenanceActive)return;const target=event.target;if(target?.isContentEditable||target?.tagName==='TEXTAREA')return;event.preventDefault();event.stopPropagation();const passcode=window.prompt('Enter the global maintenance passcode:');if(passcode!==null)send('maintenanceActivate',{passcode})},true);
render();fetchTemplates();

// Capture clicks before a screen render removes the pressed button.
document.addEventListener('click',event=>{
 const button=event.target.closest('button');
 if(!button||button.disabled||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const rect=button.getBoundingClientRect(),pulse=document.createElement('span');
 pulse.className='button-pulse';pulse.style.left=(rect.left+rect.width/2)+'px';pulse.style.top=(rect.top+rect.height/2)+'px';
 document.body.append(pulse);pulse.addEventListener('animationend',()=>pulse.remove(),{once:true});
},true);

</script></body></html>
